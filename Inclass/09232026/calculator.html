<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator</title>
    <style>
        body{
            font-size: 30px
        }
    </style>
</head>
<body>
    <h1>Calculator</h1>
    <p>
        <label for="a">First &nbsp;number</label><br>
        <input type="number" step="any">
    </p>
    <p>
        <label for="b">Second Number</label><br>
        <input type="number" step="any">
    </p>

    <button id="add">+</button>
    <button id="subtract">-</button>
    <button id="multiply">&times;</button>
    <button id="divide">&divide;</button>

    <p>
        Enter two numbers...
    </p>
</body>
</html>
